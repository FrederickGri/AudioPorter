name: Native tests and packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-amd64
          - os: macos-15
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check tagged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from bilisong import __version__
          assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__
      - name: Audit source privacy
        run: python scripts/privacy_audit.py
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build native release ZIP
        run: python build_app.py --archive
      - name: Check packaged GUI, converter and worker
        run: python scripts/check_package.py
      - name: Extract and audit the release
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys, tempfile, zipfile
          archives = list(Path('dist').glob('BiliSong-*.zip'))
          assert len(archives) == 1
          with tempfile.TemporaryDirectory(prefix='bilisong-audit-') as temporary:
              with zipfile.ZipFile(archives[0]) as archive:
                  archive.extractall(temporary)
              subprocess.run([sys.executable, 'scripts/privacy_audit.py', '--tree', temporary], check=True)
      - name: Write checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          for archive in Path('dist').glob('BiliSong-*.zip'):
              archive.with_suffix('.zip.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\n', encoding='utf-8')
      - name: Upload validated package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: BiliSong-${{ matrix.label }}
          path: |
            dist/BiliSong-*.zip
            dist/BiliSong-*.zip.sha256
            dist/smoke-result.json
            dist/smoke-result.png
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: BiliSong-*
          path: release
          merge-multiple: true
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 --draft --verify-tag --title "BiliSong $RELEASE_TAG" --notes "Native Windows x64, Apple Silicon and Intel macOS packages. Each passed native CI tests and packaged offline GUI/audio/worker checks. Windows 11 interactive acceptance and third-party corresponding-source availability must be reviewed before publishing. See docs/COMPATIBILITY.md and docs/RELEASING.md. Packages are unsigned."
